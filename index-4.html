  *{box-sizing:border-box;}
  body{
    margin:0;

    background:

      linear-gradient(90deg, var(--line-cyan-soft) 1px, transparent 1px) 0 0/28px 28px,

  .sheet{ width:100%; max-width:460px; }
  .proto-badge{
    display:inline-block;

  .controls{

  .btn{

    font-weight:600;
    font-size:13px;

    background:var(--navy-panel);

<script>
const BUFFER_LABELS = ['free time','buffer','rest','sleep','free / buffer',''];

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'task';
}

// Tasks are now derived dynamically from the timetable (custom or default), deduped per day,
// plus any custom single/weekly tasks added via Setup New Task.
function tasksForDay(dayIdx){
  const slots = (customTimetable && customTimetable[dayIdx]) ? customTimetable[dayIdx] : defaultTimetableAsSlots(dayIdx);
  const seen = new Set();
  const tasks = [];
  slots.forEach(label=>{
    const trimmed = (label||'').trim();
    const key = trimmed.toLowerCase();
    if(trimmed && !BUFFER_LABELS.includes(key) && !seen.has(key)){
      seen.add(key);
      tasks.push({ id: slugify(trimmed), name: trimmed });
    }
  });
  // NOTE: custom tasks (weekly/monthly) are DISPLAY ONLY, shown under "More" -
  // they do not appear in the checklist unless the same activity is also typed
  // directly into Setup My Schedule (the timetable).
  return tasks;
}

function getLeagueIndexForStreak(streak){

// reachedPlatinumFloor: once true, league can never display below Platinum I again.
function getLeague(streak, reachedPlatinumFloor){

}

function fmtTime12(mins){
  const m = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(m/60), mi = m%60;
  const period = h < 12 ? 'AM' : 'PM';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${mi.toString().padStart(2,'0')} ${period}`;
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Parses a "YYYY-MM-DD" key back into a local-time Date object at midnight.
// (new Date("YYYY-MM-DD") parses as UTC midnight, which shifts the day
// backwards for any timezone ahead of UTC - this avoids that bug.)
function parseDateKey(key){
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtShort(d){ return `${DAY_NAMES[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`; }

// Checks whether a given day (past or today) has every required task ticked.
// A day with zero required tasks (nothing typed into the timetable that day)
// counts as automatically satisfied, since there was nothing assigned to do.
function isDayComplete(key){
  const entry = daysLog[key];
  if(!entry) return false;
  const d = parseDateKey(key);
  const required = tasksForDay(d.getDay());
  if(required.length === 0) return true;
  return required.every(t => entry.tasks[t.id]);
}

function finalizeDayIfNeeded(key){
  if(finalizedStatus[key]) return; // already resolved (e.g. via immediate catch-up restore)
  const done = isDayComplete(key);
  finalizedStatus[key] = done ? 'completed' : 'missed';
  if(!done) missedQueue.push(key);
}

// Runs every time the app opens. Finalizes yesterday (and any days skipped
// entirely while the app was closed), rolls monthly tokens over, and prunes
// the 30-day catch-up window. This replaces manually clicking "next day."
function runRollover(){
  const nowKey = todayKeyNow();
  if(!lastActiveDateKey){
    lastActiveDateKey = nowKey;
    if(!daysLog[nowKey]) daysLog[nowKey] = { tasks:{}, note:'' };
    return;
  }
  if(lastActiveDateKey !== nowKey){
    let cursor = parseDateKey(lastActiveDateKey);
    const stop = parseDateKey(nowKey);
    while(dateKey(cursor) !== dateKey(stop)){
      finalizeDayIfNeeded(dateKey(cursor));
      cursor.setDate(cursor.getDate()+1);
    }
    lastActiveDateKey = nowKey;
  }
  if(!daysLog[nowKey]) daysLog[nowKey] = { tasks:{}, note:'' };
  pruneMissedQueue();
  const now = new Date();
  const newMonthKey = `${now.getFullYear()}-${now.getMonth()}`;
  if(newMonthKey !== currentMonthKey){
    tokensLeft = 4;
    currentMonthKey = newMonthKey;
  }
}

function computeStreak(){
  let streak = 0;
  let cursor = new Date();
  cursor.setDate(cursor.getDate()-1); // day before today (today isn't finalized yet)
  while(true){
    const key = dateKey(cursor);
    if(finalizedStatus[key] === 'completed' || finalizedStatus[key] === 'restored'){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    } else {
      break;
    }
  }
  if(streak > bestStreak) bestStreak = streak;

  const idxNow = getLeagueIndexForStreak(streak);
  if(idxNow > bestLeagueIndex) bestLeagueIndex = idxNow;
  if(idxNow >= PLATINUM_FLOOR_INDEX) reachedPlatinumFloor = true;

  return streak;
}

function pruneMissedQueue(){
  const now = new Date();
  missedQueue = missedQueue.filter(key=>{
    const d = parseDateKey(key);
    const diffDays = Math.floor((now - d) / 86400000);
    return diffDays <= 30;
  });
}

// Called right after any task tick, to resolve a catch-up the same day it's completed.
function checkImmediateCatchup(){
  if(missedQueue.length === 0 || tokensLeft <= 0) return;
  const catchupKey = missedQueue[0];
  if(finalizedStatus[catchupKey] === 'restored'){ missedQueue.shift(); return; }
  const nowKey = todayKeyNow();
  if(isDayComplete(catchupKey) && isDayComplete(nowKey)){
    finalizedStatus[catchupKey] = 'restored';
    tokensLeft--;
    missedQueue.shift();
  }
}

// Generic Day-Block parser, reused for gym-style content AND any custom task.
// Recognizes "Day N — Title" then "- Item — Detail" sub-lines. Returns array of
// {dayNum, title, items:[{name,detail}], rest} in the order encountered.
function parseBlockPaste(text){
  const lines = text.split('\n');
  const results = [];
  let current = null;
  lines.forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    const dayMatch = line.match(/^Day\s*(\d+)\s*[\u2014\u2013-]+\s*(.+)$/i);
    if(dayMatch){
      const dayNum = parseInt(dayMatch[1]);
      const title = dayMatch[2].trim();
      const isRest = /^rest$/i.test(title);
      current = { dayNum, title: isRest ? '' : title, items:[], rest:isRest };
      results.push(current);
      return;
    }
    // Bullet markers: •, -, or ~. Detail split only on an em/en dash (—/–),
    // so plain bullets with no sets/reps split still parse fine as a single item.
    const bulletMatch = line.match(/^[\u2022~-]\s*(.+)$/);
    if(bulletMatch && current && !current.rest){
      const rest = bulletMatch[1].trim();
      const detailSplit = rest.match(/^(.+?)\s*[\u2014\u2013]\s*(.+)$/);
      if(detailSplit){
        current.items.push({ name:detailSplit[1].trim(), detail:detailSplit[2].trim() });
      } else {
        current.items.push({ name:rest, detail:'' });
      }
    }
  });
  return results;
}

      const weekdayIdx = entry.dayNum === 7 ? 0 : entry.dayNum;
      if(weekdayIdx >= 0 && weekdayIdx <= 6){
        draftWeeklyTask.weeklyBlocks[weekdayIdx] = { title:entry.title, items:entry.items, rest:entry.rest };
      }
    });
  } else {
    parsed.forEach(entry=>{
      draftWeeklyTask.monthlyBlocks[entry.dayNum] = { title:entry.title, items:entry.items, rest:entry.rest };
    });
  }
  render();
}

function currentElapsedDays(task){
  const start = parseDateKey(task.startDate);
  const diff = Math.floor((new Date() - start) / 86400000) + 1;
  return diff;
}

function applicableMonthlyBlock(task){
  const elapsed = currentElapsedDays(task);
  const keys = Object.keys(task.monthlyBlocks || {}).map(Number).sort((a,b)=>a-b);
  let applicable = null;
  for(const k of keys){
    if(k <= elapsed) applicable = k;
    else break;
  }
  return applicable;
}

function formatDMY(date){
  return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
}

function dateForDayNumber(startDateStr, dayNum){
  const d = parseDateKey(startDateStr);
  d.setDate(d.getDate() + (dayNum - 1));
  return d;
}

// Given any day number, find the milestone whose key is the largest one <= dayNum
function milestoneForDayNumber(task, dayNum){
  const keys = Object.keys(task.monthlyBlocks || {}).map(Number).sort((a,b)=>a-b);
  let applicable = null;
  for(const k of keys){
    if(k <= dayNum) applicable = k;
    else break;
  }
  return applicable === null ? null : task.monthlyBlocks[applicable];
}

function toggleMonthlyDayComplete(taskId, dayNum){
  const task = customTasks.find(t=>t.id===taskId);
  if(!task) return;
  task.monthlyCompletedDays[dayNum] = !task.monthlyCompletedDays[dayNum];

}

function toggleTodayTask(id){
  const key = todayKeyNow();
  if(!daysLog[key]) daysLog[key] = { tasks:{}, note:'' };
  daysLog[key].tasks[id] = !daysLog[key].tasks[id];
  checkImmediateCatchup();
  render();
}
function toggleCatchupTask(id){
  const key = missedQueue[0];
  if(!key) return;
  if(!daysLog[key]) daysLog[key] = { tasks:{}, note:'' };
  daysLog[key].tasks[id] = !daysLog[key].tasks[id];
  checkImmediateCatchup();
  render();
}

        <div class="modal-box">
          <div class="modal-header">
            <h2>More</h2>
            <div class="modal-close" id="moreModalClose">CLOSE \u2715</div>
          </div>
          <div class="modal-body">
            <p class="section-label">SCHEDULED TASKS (REFERENCE ONLY)</p>
            <div>${rows}</div>
          </div>
        </div>
      </div>
    `;
  }

  const task = customTasks.find(t=>t.id===selectedMoreTaskId);
  let bodyHtml;
  if(task.type === 'weekly'){
    const dayOrder = [1,2,3,4,5,6,0];
    const dayShort = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const tabs = dayOrder.map(d=>`<div class="day-tab more-day-tab ${d===moreSelectedDay?'active':''}" data-day="${d}">${dayShort[d]}</div>`).join('');
    const block = task.weeklyBlocks[moreSelectedDay];
    const itemsHtml = block.rest
      ? `<div class="gym-rest">\u{1F634} Rest Day</div>`
      : (block.items.length
          ? block.items.map(it=>`<div class="gym-row"><div class="gym-name">${it.name}</div><div class="gym-detail">${it.detail}</div></div>`).join('')
          : `<div class="gym-rest">Nothing set for this day</div>`);
    bodyHtml = `
      <div class="day-tabs">${tabs}</div>
      ${block.title ? `<div class="gym-day-title">${block.title}</div>` : ''}
      <div>${itemsHtml}</div>
    `;
  } else {
    const keys = Object.keys(task.monthlyBlocks).map(Number).sort((a,b)=>a-b);
    const maxDay = keys.length ? Math.max(...keys) : 0;

    if(moreMonthlyDayDetail !== null){
      // Detail view for one specific day
      const dayNum = moreMonthlyDayDetail;
      const milestone = milestoneForDayNumber(task, dayNum);
      const dateStr = formatDMY(dateForDayNumber(task.startDate, dayNum));
      const itemsHtml = milestone && milestone.items.length
        ? milestone.items.map(it=>`<div class="gym-row"><div class="gym-name">\u2022 ${it.name}${it.detail ? ' \u2014 '+it.detail : ''}</div></div>`).join('')
        : `<div class="gym-rest">No details set for this day.</div>`;
      bodyHtml = `
        <div class="btn tt-btn" id="monthlyDayBackBtn" style="margin-bottom:12px;">\u2190 Back to Day List</div>
        <div class="gym-day-title">Day ${dayNum} \u2014 (${dateStr}) ${milestone ? milestone.title : ''}</div>
        <div>${itemsHtml}</div>
      `;
    } else if(maxDay === 0){
      bodyHtml = `<div class="gym-rest">No milestones set. Add some via Setup New Task.</div>`;
    } else {
      // Checklist of every single day, 1 through maxDay
      const dayRows = [];
      for(let n=1; n<=maxDay; n++){
        const milestone = milestoneForDayNumber(task, n);
        const dateStr = formatDMY(dateForDayNumber(task.startDate, n));
        const isDone = !!task.monthlyCompletedDays[n];
        dayRows.push(`
          <div class="task monthly-day-row ${isDone ? 'done' : ''}" data-day-num="${n}">
            <div class="checkbox monthly-day-checkbox" data-day-num="${n}">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#0d2338" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="task-text">
              <div class="task-name" style="font-size:13px;">Day ${n} (${dateStr}) - ${milestone ? milestone.title : ''}</div>
            </div>
          </div>
        `);
      }
      bodyHtml = `
        <p class="section-label">STARTED ${task.startDate} &middot; TAP A ROW TO VIEW DETAILS, TAP THE BOX TO MARK DONE</p>
        <div>${dayRows.join('')}</div>
      `;
    }
  }

  return `
    <div class="modal-overlay" id="moreModalOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2>${task.title}</h2>
          <div class="modal-close" id="moreModalClose">CLOSE \u2715</div>
        </div>
        <div class="modal-body">
          <div class="btn tt-btn" id="moreBackBtn" style="margin-bottom:12px;">\u2190 Back to List</div>
          ${bodyHtml}
        </div>
      </div>
    </div>
  `;
}

function renderRemoveTaskModal(){
  const rows = customTasks.length === 0
    ? `<div class="gym-rest">No custom tasks added yet.</div>`
    : customTasks.map(t=>`
        <div class="gym-row">
          <div class="gym-name">${t.title} <span style="color:var(--text-muted); font-size:10px;">(${t.type})</span></div>
          <div class="btn danger remove-task-btn" data-task-id="${t.id}" style="padding:5px 10px; font-size:10px;">Remove</div>
        </div>
      `).join('');

  return `
    <div class="modal-overlay" id="removeTaskOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Remove Task</h2>
          <div class="modal-close" id="removeTaskClose">CLOSE \u2715</div>
        </div>
        <div class="modal-body">
          <p class="section-label">TIMETABLE-DERIVED TASKS ARE EDITED VIA "SETUP MY SCHEDULE" &mdash; ONLY CUSTOM TASKS CAN BE REMOVED HERE</p>
          <div>${rows}</div>
        </div>
      </div>
    </div>
  `;
}

function renderTodoModal(){
  const rows = todoList.length === 0
    ? `<div class="gym-rest">Nothing on your to-do list yet.</div>`
    : todoList.map(item=>`
        <div class="task todo-row ${item.done ? 'done' : ''}">
          <div class="checkbox todo-checkbox" data-todo-id="${item.id}">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#0d2338" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="task-text">
            <div class="task-name" style="font-size:14px;">${item.text}</div>
          </div>
          <div class="btn danger todo-remove-btn" data-todo-id="${item.id}" style="flex:0 0 auto; padding:4px 8px; font-size:10px;">\u2715</div>
        </div>
      `).join('');

  return `
    <div class="modal-overlay" id="todoModalOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2>To Do List</h2>
          <div class="modal-close" id="todoModalClose">CLOSE \u2715</div>
        </div>
        <div class="modal-body">
          <p class="section-label">ROUGH &amp; FLEXIBLE &mdash; JUST FOR YOUR OWN RECORD, NOT PART OF YOUR STREAK</p>
          <div class="setup-gym-row">
            <input class="setup-input" id="newTodoInput" placeholder="Add something...">
            <div class="btn primary" id="addTodoBtn" style="flex:0 0 70px;">Add</div>
          </div>
          <div>${rows}</div>
        </div>
      </div>
    </div>
  `;
}

function renderResetConfirmModal(){
  const isProgressOnly = resetMode === 'progress';
  const titleColor = isProgressOnly ? 'var(--amber)' : 'var(--red-stamp)';
  const title = isProgressOnly ? 'Reset Progress Only?' : 'Reset All Data?';
  const bodyText = isProgressOnly
    ? 'This will permanently erase your streak, history, best rank, and unlocked badges, resetting you back to Day 0. Your custom timetable, custom tasks, and to-do list will be kept exactly as they are. This cannot be undone.'
    : 'This will permanently erase your entire streak, history, best rank, unlocked badges, custom timetable, custom tasks, and to-do list. This cannot be undone.';
  const confirmLabel = isProgressOnly ? 'Yes, Reset Progress' : 'Yes, Reset Everything';

  return `
    <div class="modal-overlay" id="resetConfirmOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2 style="color:${titleColor};">${title}</h2>
        </div>
        <div class="modal-body">
          <p style="font-family:'Inter', sans-serif; font-size:13px; line-height:1.6; margin-bottom:16px;">
            ${bodyText}
          </p>
          <div class="block-controls">
            <div class="btn danger" id="resetConfirmYes" style="border-color:${titleColor}; color:${titleColor};">${confirmLabel}</div>
            <div class="btn tt-btn" id="resetConfirmNo">Cancel</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderModal(currentStreak){
  const league = getLeague(currentStreak, reachedPlatinumFloor);
  const leagueIdx = LEAGUES.indexOf(league);
  const nextLeague = LEAGUES[leagueIdx+1];
  const progressPct = nextLeague ? Math.min(100, Math.round(((currentStreak - league.min)/(league.max - league.min))*100)) : 100;
  const bestLeague = LEAGUES[bestLeagueIndex];

  const badgeCards = BADGES.map(b=>{
    const unlocked = bestStreak >= b.threshold;
    return `
      <div class="badge-card ${unlocked ? 'unlocked' : 'locked'}">
        <span class="badge-emoji">${b.emoji}</span>
        <div class="badge-text">
          <div class="badge-name">${b.name}</div>
          <div class="badge-threshold">Achieve a ${b.threshold}-day streak</div>
        </div>
      </div>
    `;
  }).join('');

  const divisionsRows = LEAGUES.map(l=>{
    const rangeText = l.max === Infinity ? `${l.min}+` : `${l.min}\u2013${l.max-1}`;
    return `
      <div class="div-row">
        <span class="div-swatch" style="background:${l.color}"></span>
        <span class="div-name" style="color:${l.color}">${l.name} ${l.div ? `<span class="div-pips">${pipsFor(l.div)}</span>` : ''}</span>
        <span class="div-range">${rangeText}d</span>
      </div>
    `;
  }).join('');

  return `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2>Badges &amp; League</h2>
          <div class="modal-close" id="modalClose">CLOSE \u2715</div>
        </div>
        <div class="modal-body">
          <div class="league-card">
            <div class="league-sub">CURRENT LEAGUE</div>
            <div class="league-name" style="color:${league.color}">${league.tier}${league.div ? ` <span class="league-pips">${pipsFor(league.div)}</span>` : ''}</div>
            <div class="league-sub">${currentStreak}-day streak${nextLeague ? ` &middot; ${Math.max(0, nextLeague.min - currentStreak)} days to ${nextLeague.name}` : ' &middot; Top division'}</div>
            <div class="league-progress-track"><div class="league-progress-fill" style="width:${progressPct}%; background:${league.color}"></div></div>
            <div class="btn tt-btn" id="divisionsBtn" style="margin-top:10px;">See All Divisions</div>
            ${showDivisions ? `<div class="divisions-table">${divisionsRows}</div>` : ''}
          </div>
          <div class="best-streak-row">
            <span>\u{1F525} BEST STREAK</span>
            <span class="num">${bestStreak} days</span>
          </div>
          <div class="best-streak-row">
            <span>\u{1F3C5} BEST RANK</span>
            <span class="num" style="color:${bestLeague.color}">${bestLeague.tier}${bestLeague.div ? ` ${bestLeague.div}` : ''}</span>
          </div>
          <p class="section-label">BADGES (BASED ON YOUR BEST-EVER STREAK)</p>
          <div class="badges-grid">${badgeCards}</div>
        </div>
      </div>
    </div>
  `;
}

render();
</script>

      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));

</script>
